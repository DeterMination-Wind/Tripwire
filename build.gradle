plugins {
    id "java"
}

group = "tripwire"
version = "1.0.0"

java {
    sourceCompatibility = JavaVersion.VERSION_1_8
    targetCompatibility = JavaVersion.VERSION_1_8
}

def mindustryVersion = (findProperty("mindustryVersion") ?: "v154.2").toString()

repositories {
    mavenCentral()
    maven { url = "https://raw.githubusercontent.com/Zelaux/MindustryRepo/master/repository" }
    maven { url "https://jitpack.io" }
}

configurations.configureEach {
    resolutionStrategy.eachDependency { details ->
        if (details.requested.group == "com.github.Anuken.Arc" && details.requested.version == "ec5df18e54") {
            details.useVersion(mindustryVersion)
        }
    }
}

dependencies {
    compileOnly "com.github.Anuken.MindustryJitpack:core:$mindustryVersion"
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = "UTF-8"
    if (JavaVersion.current().isCompatibleWith(JavaVersion.VERSION_1_9)) {
        options.release.set(8)
    }
}

jar {
    archiveFileName = "Tripwire.zip"
    from(projectDir) {
        include "mod.json"
    }
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

tasks.register("jarDesktop", Jar) {
    group = "build"
    dependsOn tasks.named("classes")
    archiveFileName = "Tripwire-${project.version}.jar"
    from(sourceSets.main.output)
    from(projectDir) {
        include "mod.json"
    }
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

def releaseName = "Tripwire-${project.version}"
def buildOutDir = new File(rootDir.parentFile, "构建/Tripwire")
def distOutDir = file("dist")

tasks.register("copyReleaseZipToBuildDir", Copy) {
    doNotTrackState("Copies release zip artifact to workspace output folder.")
    dependsOn tasks.named("jar")
    from(tasks.named("jar").flatMap { it.archiveFile })
    into(buildOutDir)
    rename { _ -> "${releaseName}.zip" }
}

tasks.register("copyReleaseJarToBuildDir", Copy) {
    doNotTrackState("Copies release jar artifact to workspace output folder.")
    dependsOn tasks.named("jarDesktop")
    from(tasks.named("jarDesktop").flatMap { it.archiveFile })
    into(buildOutDir)
    rename { _ -> "${releaseName}.jar" }
}

tasks.register("copyReleaseZipToDist", Copy) {
    dependsOn tasks.named("jar")
    from(tasks.named("jar").flatMap { it.archiveFile })
    into(distOutDir)
    rename { _ -> "${releaseName}.zip" }
}

tasks.register("releaseArtifacts") {
    group = "build"
    dependsOn tasks.named("copyReleaseZipToBuildDir")
    dependsOn tasks.named("copyReleaseJarToBuildDir")
    dependsOn tasks.named("copyReleaseZipToDist")
}

tasks.register("deploy") {
    group = "build"
    dependsOn tasks.named("jar")
    dependsOn tasks.named("jarDesktop")
    dependsOn tasks.named("releaseArtifacts")
}
