name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Build
        run: |
          chmod +x ./gradlew
          ./gradlew deploy

      - name: Prepare release artifact
        run: |
          version="${GITHUB_REF_NAME#v}"
          mkdir -p release
          cp build/libs/Tripwire.zip "release/Tripwire-${version}.zip"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" release/* --title "Tripwire $GITHUB_REF_NAME" --generate-notes --verify-tag
