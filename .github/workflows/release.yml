name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Build
        run: |
          chmod +x ./gradlew
          mkdir -p .ci
          curl -L --fail -o .ci/Mindustry.jar https://github.com/Anuken/Mindustry/releases/download/v159/Mindustry.jar
          ./gradlew deploy -PmindustryJar="$PWD/.ci/Mindustry.jar"

      - name: Prepare release artifact
        run: |
          version="${GITHUB_REF_NAME#v}"
          mkdir -p release
          cp build/libs/Tripwire.zip "release/Tripwire-${version}.zip"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" release/* --title "Tripwire $GITHUB_REF_NAME" --notes-from-tag --verify-tag
